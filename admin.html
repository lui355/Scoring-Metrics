<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fishbowl Topics - Admin</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js"></script>
  <script defer src="./js/app.js"></script>
</head>
<body class="min-h-screen bg-zinc-950 text-white">
  <main class="mx-auto max-w-7xl px-4 py-5 sm:px-6 sm:py-8">
    <header class="flex flex-col gap-4 rounded-[2rem] border border-white/10 bg-white/5 p-5 sm:flex-row sm:items-center sm:justify-between">
      <div>
        <p class="text-sm font-semibold uppercase tracking-wide text-blue-200">Facilitator dashboard</p>
        <h1 id="bowlName" class="mt-1 text-3xl font-bold sm:text-5xl">Fishbowl Topics</h1>
        <p id="openStatus" class="mt-2 text-zinc-400">Loading...</p>
      </div>
      <div class="flex flex-wrap gap-3">
        <button id="closeButton" class="rounded-2xl bg-amber-400 px-5 py-4 font-bold text-zinc-950">Close submissions</button>
        <button id="copyButton" class="rounded-2xl bg-white px-5 py-4 font-bold text-zinc-950">Copy submit link</button>
      </div>
    </header>

    <section class="mt-5 grid gap-5 lg:grid-cols-[360px_1fr]">
      <aside class="rounded-[2rem] border border-white/10 bg-white/5 p-5">
        <h2 class="text-xl font-bold">Participant QR</h2>
        <div class="mt-4 rounded-3xl bg-white p-4"><div id="qr" class="flex justify-center"></div></div>
        <p id="submitLink" class="mt-4 break-all text-sm text-zinc-400"></p>
      </aside>

      <section class="rounded-[2rem] border border-white/10 bg-white/5 p-5">
        <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
          <div>
            <h2 class="text-2xl font-bold">Live topics <span id="count" class="text-blue-200">0</span></h2>
            <p class="text-zinc-400">New anonymous submissions appear here in realtime.</p>
          </div>
          <button id="nextButton" class="rounded-2xl bg-blue-600 px-6 py-4 text-lg font-bold hover:bg-blue-500">Pick Random Topic</button>
        </div>
        <div id="display" class="mt-5 flex min-h-72 items-center justify-center rounded-[2rem] border border-blue-400/20 bg-blue-500/10 p-6 text-center">
          <p class="text-3xl font-semibold text-blue-100 sm:text-5xl">Ready when you are.</p>
        </div>
        <div id="topics" class="mt-5 grid gap-3"></div>
      </section>
    </section>
  </main>

  <script>
    const bowlId = new URLSearchParams(location.search).get('id');
    let bowl = null;
    let submissions = [];
    let deck = [];

    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('closeButton').addEventListener('click', toggleClosed);
      document.getElementById('copyButton').addEventListener('click', copySubmitLink);
      document.getElementById('nextButton').addEventListener('click', pickNext);
      init();
    });

    async function init() {
      if (!bowlId) return Fishbowl.showToast('Missing bowl ID.', 'error');
      if (!Fishbowl.requireConfigured()) return;
      const url = Fishbowl.submitUrl(bowlId);
      document.getElementById('submitLink').textContent = url;
      Fishbowl.renderQr('qr', url, 260);
      await loadBowl();
      await loadSubmissions();
      subscribeRealtime();
    }

    async function loadBowl() {
      const { data, error } = await Fishbowl.client.from('fishbowls').select('*').eq('id', bowlId).single();
      if (error) return Fishbowl.showToast(error.message, 'error');
      bowl = data;
      document.getElementById('bowlName').textContent = bowl.name;
      renderStatus();
    }

    function renderStatus() {
      const status = document.getElementById('openStatus');
      const button = document.getElementById('closeButton');
      status.textContent = bowl.is_open ? 'Submissions are open.' : 'Submissions are closed.';
      button.textContent = bowl.is_open ? 'Close submissions' : 'Reopen submissions';
      button.className = bowl.is_open ? 'rounded-2xl bg-amber-400 px-5 py-4 font-bold text-zinc-950' : 'rounded-2xl bg-emerald-400 px-5 py-4 font-bold text-zinc-950';
    }

    async function loadSubmissions() {
      const { data, error } = await Fishbowl.client.from('submissions').select('*').eq('fishbowl_id', bowlId).order('created_at', { ascending: true });
      if (error) return Fishbowl.showToast(error.message, 'error');
      submissions = data || [];
      deck = Fishbowl.shuffle(submissions);
      renderTopics();
    }

    function subscribeRealtime() {
      Fishbowl.client.channel(`fishbowl-${bowlId}`)
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'submissions', filter: `fishbowl_id=eq.${bowlId}` }, (payload) => {
          submissions.push(payload.new);
          deck.push(payload.new);
          renderTopics();
          Fishbowl.showToast('New topic added.', 'success');
        })
        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'fishbowls', filter: `id=eq.${bowlId}` }, (payload) => {
          bowl = payload.new;
          renderStatus();
        })
        .subscribe();
    }

    function renderTopics() {
      document.getElementById('count').textContent = submissions.length;
      const topics = document.getElementById('topics');
      topics.innerHTML = submissions.length ? submissions.map((item, index) => `
        <article class="rounded-2xl border border-white/10 bg-zinc-900/80 p-4">
          <p class="text-sm font-semibold text-zinc-500">#${index + 1}</p>
          <p class="mt-1 text-lg">${Fishbowl.escapeHtml(item.topic)}</p>
        </article>
      `).join('') : '<p class="rounded-2xl border border-dashed border-white/10 p-8 text-center text-zinc-400">Waiting for topics...</p>';
    }

    async function toggleClosed() {
      const { data, error } = await Fishbowl.client.from('fishbowls').update({ is_open: !bowl.is_open }).eq('id', bowlId).select().single();
      if (error) return Fishbowl.showToast(error.message, 'error');
      bowl = data;
      renderStatus();
    }

    async function copySubmitLink() {
      await navigator.clipboard.writeText(Fishbowl.submitUrl(bowlId));
      Fishbowl.showToast('Submit link copied.', 'success');
    }

    function pickNext() {
      if (!submissions.length) return Fishbowl.showToast('No topics yet.', 'error');
      if (!deck.length) deck = Fishbowl.shuffle(submissions);
      const next = deck.pop();
      document.getElementById('display').innerHTML = `<div><p class="mb-4 text-sm font-bold uppercase tracking-[.3em] text-blue-200">Discuss this</p><p class="text-4xl font-bold leading-tight sm:text-7xl">${Fishbowl.escapeHtml(next.topic)}</p><button onclick="pickNext()" class="mt-8 rounded-2xl bg-white px-8 py-4 text-xl font-bold text-zinc-950">Next</button></div>`;
    }
  </script>
</body>
</html>
