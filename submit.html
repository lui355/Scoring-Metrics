<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fishbowl Topics - Submit</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="./js/app.js"></script>
</head>
<body class="min-h-screen bg-zinc-950 text-white">
  <main class="mx-auto flex min-h-screen max-w-xl items-center justify-center px-5 py-8">
    <section id="form" class="w-full rounded-[2rem] border border-white/10 bg-white/5 p-6 shadow-2xl">
      <p id="bowlName" class="mb-4 text-center text-sm font-semibold uppercase tracking-wide text-blue-200">Fishbowl Topics</p>
      <h1 class="text-center text-4xl font-semibold tracking-tight">Drop a topic in the bowl</h1>
      <p id="status" class="mt-4 text-center text-zinc-400">Anonymous. No login required.</p>
      <textarea id="topic" rows="7" maxlength="500" class="mt-7 w-full resize-none rounded-2xl border border-zinc-700 bg-zinc-900 p-5 text-lg outline-none transition focus:border-blue-400 focus:ring-4 focus:ring-blue-400/10" placeholder="One topic or question for the group to discuss..."></textarea>
      <button id="submitButton" class="mt-5 w-full rounded-2xl bg-blue-600 px-6 py-5 text-xl font-bold transition hover:bg-blue-500 active:scale-[.99]">Submit Anonymously 🐟</button>
    </section>
  </main>

  <script>
    const bowlId = new URLSearchParams(location.search).get('id');
    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('submitButton').addEventListener('click', submitTopic);
      loadBowl();
    });

    async function loadBowl() {
      if (!bowlId) return showMissing();
      if (!Fishbowl.requireConfigured()) return;
      const { data, error } = await Fishbowl.client.from('fishbowls').select('name, is_open').eq('id', bowlId).single();
      if (error || !data) return showMissing();
      document.getElementById('bowlName').textContent = data.name;
      if (!data.is_open) {
        document.getElementById('status').textContent = 'This bowl is closed for new topics.';
        document.getElementById('topic').disabled = true;
        document.getElementById('submitButton').disabled = true;
        document.getElementById('submitButton').textContent = 'Submissions Closed';
        document.getElementById('submitButton').classList.add('bg-zinc-700', 'hover:bg-zinc-700');
      }
    }

    function showMissing() {
      document.getElementById('form').innerHTML = '<div class="py-16 text-center"><div class="text-6xl">🐟</div><h1 class="mt-5 text-3xl font-bold">Bowl not found</h1><p class="mt-3 text-zinc-400">Ask your facilitator for a fresh QR code.</p></div>';
    }

    async function submitTopic() {
      const topic = document.getElementById('topic').value.trim();
      if (!topic || !bowlId) return Fishbowl.showToast('Please write a topic first.', 'error');
      const button = document.getElementById('submitButton');
      button.disabled = true;
      button.textContent = 'Submitting...';
      const { error } = await Fishbowl.client.from('submissions').insert({ fishbowl_id: bowlId, topic });
      if (error) {
        button.disabled = false;
        button.textContent = 'Submit Anonymously 🐟';
        return Fishbowl.showToast(error.message, 'error');
      }
      document.getElementById('form').innerHTML = '<div class="py-20 text-center"><div class="text-7xl">✅</div><h2 class="mt-6 text-3xl font-semibold">Topic received!</h2><p class="mt-3 text-zinc-400">Thank you. It is in the bowl.</p><button onclick="location.reload()" class="mt-8 rounded-2xl bg-white px-6 py-4 font-bold text-zinc-950">Submit another</button></div>';
    }
  </script>
</body>
</html>
